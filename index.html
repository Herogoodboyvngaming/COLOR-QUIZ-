<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRÒ CHƠI ĐỐ MÀU</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const playerParam = params.get('player');
        let player = playerParam ? Number(playerParam) : null;

        const COLORS = [
            {NAME: 'ĐỎ', HEX: '#FF0000'},
            {NAME: 'CAM', HEX: '#FFA500'},
            {NAME: 'VÀNG', HEX: '#FFFF00'},
            {NAME: 'XANH LÁ', HEX: '#00FF00'},
            {NAME: 'XANH DƯƠNG', HEX: '#0000FF'},
            {NAME: 'TÍM', HEX: '#800080'},
            {NAME: 'HỒNG', HEX: '#FFC0CB'},
            {NAME: 'NÂU', HEX: '#A52A2A'},
            {NAME: 'ĐEN', HEX: '#000000'},
            {NAME: 'TRẮNG', HEX: '#FFFFFF'},
            {NAME: 'XÁM', HEX: '#808080'},
            {NAME: 'XANH NGỌC', HEX: '#00FFFF'},
            {NAME: 'HỒNG PHẤN', HEX: '#FF69B4'},
            {NAME: 'VÀNG KIM', HEX: '#FFD700'},
            {NAME: 'NAVY', HEX: '#000080'},
            {NAME: 'ĐỎ RƯỢU', HEX: '#8B0000'},
            {NAME: 'OLIVE', HEX: '#808000'},
            {NAME: 'TEAL', HEX: '#008080'},
            {NAME: 'VIOLET', HEX: '#EE82EE'},
            {NAME: 'CORAL', HEX: '#FF7F50'},
        ];

        const SOUNDS = {
            CORRECT: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_4e79e3c6d3.mp3?filename=success-1-6297.mp3',
            WRONG: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_8c8b6d1f3f.mp3?filename=wrong-answer-129254.mp3',
            VICTORY: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_3d7c5a3a3e.mp3?filename=fanfare-6302.mp3',
            BUY: 'https://cdn.pixabay.com/download/audio/2022/05/13/audio_8c3e3d3e4f.mp3?filename=cash-register-172293.mp3',
            WARNING: 'https://cdn.pixabay.com/download/audio/2023/08/22/audio_9d8e3b3e4f.mp3?filename=alarm-clock-64535.mp3',
            FAIL: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_8c8b6d1f3f.mp3?filename=wrong-answer-129254.mp3'
        };

        function PLAY_SOUND(TYPE) {
            const AUDIO = new Audio(SOUNDS[TYPE] || SOUNDS.CORRECT);
            AUDIO.VOLUME = 0.6;
            AUDIO.PLAY().CATCH(() => {});
        }

        const STATE_KEY = 'COLORGAME2026';

        function GET_STATE() {
            const S = localStorage.getItem(STATE_KEY);
            return S ? JSON.parse(S) : {PLAYER_SCORE: 0, INVENTORY: []};
        }

        function SET_STATE(STATE) {
            localStorage.setItem(STATE_KEY, JSON.stringify(STATE));
        }

        function GET_TEXT_COLOR(HEX) {
            const R = parseInt(HEX.slice(1, 3), 16);
            const G = parseInt(HEX.slice(3, 5), 16);
            const B = parseInt(HEX.slice(5, 7), 16);
            const LUMA = 0.299 * R + 0.587 * G + 0.114 * B;
            return LUMA > 186 ? '#000000' : '#FFFFFF';
        }

        function CREATE_BUTTON(TEXT, ONCLICK) {
            const BTN = document.createElement('BUTTON');
            BTN.textContent = TEXT;
            BTN.classList.add('BTN');
            BTN.onclick = ONCLICK;
            return BTN;
        }

        function CREATE_FOOTER(PARENT) {
            const FOOTER = document.createElement('FOOTER');
            const LINES = [
                'MADE IN VN 🇻🇳',
                'MADE BY : NGUYỄN CHÍ DỰ ♥️🇻🇳',
                'GMAIL HỖ TRỢ : Herogoodboymc2024@gmail.com'
            ];
            LINES.forEach(LINE => {
                const P = document.createElement('P');
                P.textContent = LINE;
                FOOTER.appendChild(P);
            });
            const REPORT_BTN = CREATE_BUTTON('BÁO CÁO LỖI', () => {
                document.getElementById('BUG-MODAL').style.display = 'BLOCK';
            });
            FOOTER.appendChild(REPORT_BTN);
            PARENT.appendChild(FOOTER);
        }

        const SHOP_ITEMS = [
            {ID: 'REVEAL', NAME: 'MẮT NHÌN XUYÊN THẤU', DESC: 'NHÌN THẤY MÀU ĐÚNG TRONG 10 GIÂY', PRICE: 100000},
            {ID: 'HINT3', NAME: 'GỢI Ý 3 MÀU SAI', DESC: 'LOẠI BỎ 3 MÀU SAI KHỎI BẢNG', PRICE: 50000},
            {ID: 'EXTRA_TIME', NAME: 'THỜI GIAN THÊM', DESC: '+3 PHÚT ĐẾM NGƯỢC', PRICE: 40000},
            {ID: 'HALF_WRONG', NAME: 'GIẢM NỬA SAI', DESC: 'GIẢM 1/2 SỐ LẦN SAI ĐÃ CÓ', PRICE: 35000},
            {ID: 'DOUBLE_POINT', NAME: 'NHÂN ĐÔI ĐIỂM', DESC: 'ĐOÁN ĐÚNG LẦN NÀY +20 ĐIỂM', PRICE: 80000},
        ];

        if (!player) {
            document.body.innerHTML = '';
            const CONTAINER = document.createElement('DIV');
            CONTAINER.id = 'CONTAINER';
            document.body.appendChild(CONTAINER);

            const HEADER = document.createElement('HEADER');
            const TITLE = document.createElement('H1');
            TITLE.textContent = 'TRÒ CHƠI ĐỐ MÀU';
            HEADER.appendChild(TITLE);

            const SUBTITLE = document.createElement('P');
            SUBTITLE.textContent = 'CHÚC CÁC BẠN CHƠI VUI VẺ CÓ LỖI KÉO XUỐNG DƯỚI CHÂN TRANG BẤM VÀO NÚT BÁO CÁO NHA :)';
            SUBTITLE.classList.add('SUBTITLE');
            HEADER.appendChild(SUBTITLE);
            CONTAINER.appendChild(HEADER);

            const MAIN = document.createElement('DIV');
            MAIN.classList.add('HOME-MAIN');

            const CURRENT_SCORE = GET_STATE().PLAYER_SCORE || 0;
            const SCORE_INFO = document.createElement('P');
            SCORE_INFO.textContent = `ĐIỂM HIỆN TẠI CỦA BẠN: ${CURRENT_SCORE.toLocaleString()}`;
            SCORE_INFO.style.fontWeight = 'BOLD';
            SCORE_INFO.style.color = '#FFFF00';
            SCORE_INFO.style.fontSize = '2.2EM';
            SCORE_INFO.style.marginBottom = '30PX';
            MAIN.appendChild(SCORE_INFO);

            const INFO = document.createElement('P');
            INFO.textContent = 'PLAYER 1 LÀ BOT - BẠN LÀ NGƯỜI ĐOÁN MÀU!';
            INFO.style.fontWeight = 'BOLD';
            INFO.style.color = '#FFFF00';
            INFO.style.fontSize = '2EM';
            MAIN.appendChild(INFO);

            const START_BTN = CREATE_BUTTON('BẮT ĐẦU CHƠI VỚI BOT', () => {
                if (confirm('BẠN SẴN SÀNG CHƠI VỚI BOT CHƯA?')) {
                    location.href = location.pathname + '?player=2';
                }
            });
            START_BTN.classList.add('LARGE');
            MAIN.appendChild(START_BTN);

            CONTAINER.appendChild(MAIN);
            CREATE_FOOTER(CONTAINER);

            const MODAL = document.createElement('DIV');
            MODAL.id = 'BUG-MODAL';
            const H = document.createElement('H2');
            H.textContent = 'BÁO CÁO LỖI';
            MODAL.appendChild(H);

            const INPUTS = ['TÊN CỦA BẠN (BẮT BUỘC)', 'GMAIL CỦA BẠN (BẮT BUỘC)', 'MÔ TẢ LỖI (BẮT BUỘC)'];
            const FIELDS = [];
            INPUTS.forEach(PLACEHOLDER => {
                const INPUT = document.createElement(PLACEHOLDER.includes('MÔ TẢ') ? 'TEXTAREA' : 'INPUT');
                INPUT.placeholder = PLACEHOLDER;
                if (PLACEHOLDER.includes('MÔ TẢ')) INPUT.rows = 6;
                MODAL.appendChild(INPUT);
                FIELDS.push(INPUT);
            });

            const SEND = CREATE_BUTTON('GỬI BÁO CÁO', () => {
                if (FIELDS.every(F => F.value.trim())) {
                    alert('CẢM ƠN BẠN ĐÃ BÁO CÁO! MÌNH SẼ SỬA NGAY NHA 😊');
                    MODAL.style.display = 'NONE';
                    FIELDS.forEach(F => F.value = '');
                } else {
                    alert('BẠN BẮT BUỘC PHẢI NHẬP ĐẦY ĐỦ MỚI GỬI ĐƯỢC NHA');
                }
            });
            MODAL.appendChild(SEND);

            const CLOSE = CREATE_BUTTON('ĐÓNG', () => MODAL.style.display = 'NONE');
            MODAL.appendChild(CLOSE);

            document.body.appendChild(MODAL);
        } else if (player === 2) {
            document.body.innerHTML = '';
            const CONTAINER = document.createElement('DIV');
            CONTAINER.id = 'CONTAINER';
            document.body.appendChild(CONTAINER);

            const HEADER = document.createElement('DIV');
            HEADER.classList.add('GAME-HEADER');
            const TITLE = document.createElement('H1');
            TITLE.textContent = 'TRÒ CHƠI ĐỐ MÀU - BẠN VS BOT';
            HEADER.appendChild(TITLE);

            const SHOP_BTN = CREATE_BUTTON('CỬA HÀNG SKILL', () => {
                SHOW_SHOP();
            });
            SHOP_BTN.classList.add('SHOP-BTN');
            HEADER.appendChild(SHOP_BTN);

            const BACK_BTN = CREATE_BUTTON('TRỞ VỀ TRANG CHỦ', () => {
                if (confirm('THOÁT KHỎI TRÒ CHƠI?')) {
                    location.href = location.pathname;
                }
            });
            HEADER.appendChild(BACK_BTN);

            const RESET_BTN = CREATE_BUTTON('RESET ĐIỂM', () => {
                if (confirm('RESET ĐIỂM CỦA BẠN VỀ 0? (KHÔNG THỂ HOÀN TÁC)')) {
                    const NEW_STATE = {PLAYER_SCORE: 0, INVENTORY: []};
                    SET_STATE(NEW_STATE);
                    UPDATE_VIEW();
                    alert('ĐIỂM ĐÃ ĐƯỢC RESET VỀ 0!');
                }
            });
            HEADER.appendChild(RESET_BTN);

            const INFO_BTN = CREATE_BUTTON('ℹ️ THÔNG TIN & UPDATE', () => {
                document.getElementById('INFO-MODAL').style.display = 'BLOCK';
            });
            HEADER.appendChild(INFO_BTN);

            CONTAINER.appendChild(HEADER);

            const SCORE_BOARD = document.createElement('DIV');
            SCORE_BOARD.id = 'SCORE-BOARD';
            const PLAYER_SCORE = document.createElement('DIV');
            PLAYER_SCORE.id = 'PLAYER-SCORE';
            SCORE_BOARD.appendChild(PLAYER_SCORE);
            CONTAINER.appendChild(SCORE_BOARD);

            const MAIN_VIEW = document.createElement('DIV');
            MAIN_VIEW.id = 'MAIN-VIEW';
            CONTAINER.appendChild(MAIN_VIEW);

            const OVERLAY = document.createElement('DIV');
            OVERLAY.id = 'OVERLAY';
            const WAIT_TEXT = document.createElement('DIV');
            WAIT_TEXT.textContent = 'BOT ĐANG ĐẶT MÀU BÍ MẬT...';
            WAIT_TEXT.classList.add('BLINK');
            const WAIT_TIMER = document.createElement('DIV');
            WAIT_TIMER.id = 'WAIT-TIMER';
            OVERLAY.appendChild(WAIT_TEXT);
            OVERLAY.appendChild(WAIT_TIMER);
            document.body.appendChild(OVERLAY);

            const WARNING_MSG = document.createElement('DIV');
            WARNING_MSG.id = 'WARNING-MSG';
            WARNING_MSG.textContent = '🚨 NHANH LÊN THỜI GIAN SẮP HẾT, HẾT LÀ BẠN THUA ĐÓ! 🚨';
            WARNING_MSG.style.display = 'NONE';
            document.body.appendChild(WARNING_MSG);

            const TIME_UP_MSG = document.createElement('DIV');
            TIME_UP_MSG.id = 'TIME-UP-MSG';
            TIME_UP_MSG.textContent = 'THỜI GIAN HẾT!';
            TIME_UP_MSG.style.display = 'NONE';
            document.body.appendChild(TIME_UP_MSG);

            const SHOP_MODAL = document.createElement('DIV');
            SHOP_MODAL.id = 'SHOP-MODAL';
            document.body.appendChild(SHOP_MODAL);

            const INVENTORY_BAR = document.createElement('DIV');
            INVENTORY_BAR.id = 'INVENTORY-BAR';
            INVENTORY_BAR.style.display = 'NONE';
            document.body.appendChild(INVENTORY_BAR);

            const INFO_MODAL = document.createElement('DIV');
            INFO_MODAL.id = 'INFO-MODAL';
            INFO_MODAL.style.display = 'NONE';
            const INFO_TITLE = document.createElement('H2');
            INFO_TITLE.textContent = 'ℹ️ THÔNG TIN & UPDATE';
            INFO_MODAL.appendChild(INFO_TITLE);

            const INFO_CONTENT = document.createElement('P');
            INFO_CONTENT.innerHTML = `
                <strong>CẬP NHẬT MỚI NHẤT (06/01/2026):</strong><br><br>
                • Bot đặt màu bí mật chỉ trong <strong>30 GIÂY</strong> (cố định).<br>
                • <strong>THÊM GỢI Ý</strong>: Bấm nút "GỢI Ý" để loại bỏ 3 màu sai (miễn phí 1 lần/lượt).<br>
                • Nút "BẮT ĐẦU CHƠI VỚI BOT" và "CHƠI LẠI VỚI BOT" có <strong>xác nhận</strong> tránh bấm nhầm.<br>
                • Không còn timer đếm ngược khi đoán, chỉ hiện cảnh báo khi sắp hết giờ.<br>
                • Giao diện tối ưu cho mọi thiết bị (PC, Android, iOS).<br><br>
                CHƠI VUI VẺ NHÉ! 🎉
            `;
            INFO_MODAL.appendChild(INFO_CONTENT);

            const CLOSE_INFO = CREATE_BUTTON('ĐÓNG', () => INFO_MODAL.style.display = 'NONE');
            INFO_MODAL.appendChild(CLOSE_INFO);

            document.body.appendChild(INFO_MODAL);

            CREATE_FOOTER(CONTAINER);

            let HAS_WARNED = false;
            let HINT_USED = false;

            function UPDATE_SCORES() {
                const STATE = GET_STATE();
                document.getElementById('PLAYER-SCORE').textContent = `ĐIỂM CỦA BẠN: ${STATE.PLAYER_SCORE.toLocaleString()}`;
            }

            function SHOW_SHOP() {
                const STATE = GET_STATE();
                SHOP_MODAL.innerHTML = '';
                SHOP_MODAL.style.display = 'BLOCK';

                const TITLE = document.createElement('H2');
                TITLE.textContent = 'CỬA HÀNG SKILL';
                SHOP_MODAL.appendChild(TITLE);

                const CURRENT_POINT = document.createElement('P');
                CURRENT_POINT.textContent = `ĐIỂM HIỆN TẠI: ${STATE.PLAYER_SCORE.toLocaleString()}`;
                CURRENT_POINT.style.fontSize = '1.8EM';
                CURRENT_POINT.style.color = '#FFFF00';
                SHOP_MODAL.appendChild(CURRENT_POINT);

                SHOP_ITEMS.forEach(ITEM => {
                    const CARD = document.createElement('DIV');
                    CARD.classList.add('SHOP-ITEM');

                    const NAME = document.createElement('H3');
                    NAME.textContent = ITEM.NAME;
                    CARD.appendChild(NAME);

                    const DESC = document.createElement('P');
                    DESC.textContent = ITEM.DESC;
                    CARD.appendChild(DESC);

                    const PRICE = document.createElement('P');
                    PRICE.textContent = `GIÁ: ${ITEM.PRICE.toLocaleString()} ĐIỂM`;
                    PRICE.style.color = '#FF4444';
                    PRICE.style.fontWeight = 'BOLD';
                    CARD.appendChild(PRICE);

                    const BUY_BTN = CREATE_BUTTON('MUA NGAY', () => {
                        if (STATE.PLAYER_SCORE < ITEM.PRICE) {
                            PLAY_SOUND('FAIL');
                            alert('XIN LỖI BẠN, BẠN KHÔNG ĐỦ ĐIỂM ĐỂ MUA SKILL NÀY. VUI LÒNG CÀY ĐỦ ĐIỂM VÀ MUA LẠI NHÉ');
                            return;
                        }
                        if (confirm(`MUA ${ITEM.NAME} VỚI ${ITEM.PRICE.toLocaleString()} ĐIỂM?`)) {
                            PLAY_SOUND('BUY');
                            const NEW_STATE = {...STATE};
                            NEW_STATE.PLAYER_SCORE -= ITEM.PRICE;
                            NEW_STATE.INVENTORY.push(ITEM.ID);
                            SET_STATE(NEW_STATE);
                            alert('MUA THÀNH CÔNG! SKILL ĐÃ VÀO TÚI ĐỒ!');
                            SHOP_MODAL.style.display = 'NONE';
                            UPDATE_VIEW();
                        }
                    });
                    CARD.appendChild(BUY_BTN);

                    SHOP_MODAL.appendChild(CARD);
                });

                const CLOSE_BTN = CREATE_BUTTON('ĐÓNG CỬA HÀNG', () => SHOP_MODAL.style.display = 'NONE');
                SHOP_MODAL.appendChild(CLOSE_BTN);
            }

            function SHOW_INVENTORY() {
                const STATE = GET_STATE();
                INVENTORY_BAR.innerHTML = '';
                INVENTORY_BAR.style.display = 'FLEX';

                const TITLE = document.createElement('P');
                TITLE.textContent = 'TÚI ĐỒ SKILL:';
                TITLE.style.marginRight = '10PX';
                INVENTORY_BAR.appendChild(TITLE);

                SHOP_ITEMS.forEach(ITEM => {
                    if (STATE.INVENTORY.includes(ITEM.ID)) {
                        const USE_BTN = CREATE_BUTTON(ITEM.NAME, () => {
                            if (STATE.ACTIVE_SKILL && STATE.ACTIVE_SKILL.ID === ITEM.ID) {
                                alert('SKILL NÀY ĐÃ ĐƯỢC KÍCH HOẠT RỒI!');
                                return;
                            }
                            const NEW_STATE = {...STATE};
                            NEW_STATE.ACTIVE_SKILL = {ID: ITEM.ID};
                            NEW_STATE.INVENTORY = NEW_STATE.INVENTORY.filter(I => I !== ITEM.ID);
                            SET_STATE(NEW_STATE);
                            alert(`ĐÃ KÍCH HOẠT ${ITEM.NAME}!`);
                            UPDATE_VIEW();
                        });
                        USE_BTN.classList.add('INVENTORY-BTN');
                        INVENTORY_BAR.appendChild(USE_BTN);
                    }
                });
            }

            function APPLY_SKILL(STATE) {
                if (!STATE.ACTIVE_SKILL) return false;
                return true;
            }

            function CREATE_PALETTE(STATE) {
                const WRAPPER = document.createElement('DIV');
                WRAPPER.classList.add('COLOR-WRAPPER');

                let AVAILABLE_COLORS = COLORS.slice();
                if (STATE.ACTIVE_SKILL && STATE.ACTIVE_SKILL.ID === 'HINT3' && APPLY_SKILL(STATE)) {
                    let WRONG_COLORS = COLORS.filter(C => C.HEX !== STATE.SECRET_COLOR);
                    WRONG_COLORS.sort(() => Math.random() - 0.5);
                    const TO_REMOVE = WRONG_COLORS.slice(0, 3).map(C => C.HEX);
                    AVAILABLE_COLORS = COLORS.filter(C => !TO_REMOVE.includes(C.HEX));
                }

                AVAILABLE_COLORS.forEach(C => {
                    const BTN = document.createElement('BUTTON');
                    BTN.classList.add('COLOR-BTN');
                    BTN.style.backgroundColor = C.HEX;
                    BTN.style.color = GET_TEXT_COLOR(C.HEX);
                    BTN.textContent = C.NAME;

                    if (STATE.ACTIVE_SKILL && STATE.ACTIVE_SKILL.ID === 'REVEAL' && APPLY_SKILL(STATE)) {
                        if (C.HEX === STATE.SECRET_COLOR) {
                            BTN.classList.add('REVEAL');
                        }
                    }

                    BTN.onclick = () => {
                        if (C.HEX === STATE.SECRET_COLOR) {
                            PLAY_SOUND('CORRECT');
                            PLAY_SOUND('VICTORY');
                            let BONUS = 10;
                            if (STATE.ACTIVE_SKILL && STATE.ACTIVE_SKILL.ID === 'DOUBLE_POINT' && APPLY_SKILL(STATE)) BONUS = 20;
                            const NEW_STATE = {...STATE};
                            NEW_STATE.PLAYER_SCORE += BONUS;
                            delete NEW_STATE.ACTIVE_SKILL;
                            SET_STATE(NEW_STATE);
                            SHOW_RESULT(true, BONUS);
                        } else {
                            PLAY_SOUND('WRONG');
                            const CURRENT_SCORE = STATE.PLAYER_SCORE || 0;
                            if (CURRENT_SCORE > 0) {
                                const NEW_STATE = {...STATE};
                                NEW_STATE.PLAYER_SCORE -= 10;
                                NEW_STATE.WRONG_GUESSES += 1;
                                SET_STATE(NEW_STATE);
                                alert('SAI RỒI!!! -10 ĐIỂM 😭');
                            } else {
                                const NEW_STATE = {...STATE};
                                NEW_STATE.WRONG_GUESSES += 1;
                                SET_STATE(NEW_STATE);
                                alert('SAI RỒI!!! BẠN KHÔNG CÓ ĐIỂM NÊN KHÔNG BỊ TRỪ 😅');
                            }
                            UPDATE_VIEW();
                        }
                    };
                    WRAPPER.appendChild(BTN);
                });
                return WRAPPER;
            }

            function SHOW_RESULT(CORRECT, BONUS = 10) {
                MAIN_VIEW.innerHTML = '';
                const MSG = document.createElement('H2');
                MSG.textContent = CORRECT ? `CHÚC MỪNG! +${BONUS} ĐIỂM 🎉🎉` : 'HẾT GIỜ HOẶC SAI QUÁ 3 LẦN - BẠN THUA RỒI!';
                MSG.style.color = CORRECT ? '#00FF00' : '#FF4444';
                MAIN_VIEW.appendChild(MSG);

                const NEXT_BTN = CREATE_BUTTON('CHƠI LẠI VỚI BOT', () => {
                    if (confirm('BẠN MUỐN CHƠI LẠI VỚI BOT THẬT CHỨ? (ĐIỂM VÀ TÚI ĐỒ GIỮ NGUYÊN)')) {
                        BOT_SET_COLOR_AND_WAIT();
                    }
                });
                NEXT_BTN.classList.add('LARGE');
                MAIN_VIEW.appendChild(NEXT_BTN);
            }

            function BOT_SET_COLOR_AND_WAIT() {
                const SECRET = COLORS[Math.floor(Math.random() * COLORS.length)].HEX;
                const WAIT_DURATION = 30000;
                const STATE = GET_STATE();
                const NEW_STATE = {
                    SECRET_COLOR: SECRET,
                    STATE: 'WAITING',
                    TIMER_START: Date.now(),
                    TIMER_DURATION: WAIT_DURATION,
                    PLAYER_SCORE: STATE.PLAYER_SCORE,
                    INVENTORY: STATE.INVENTORY || [],
                    WRONG_GUESSES: 0
                };
                SET_STATE(NEW_STATE);
                HINT_USED = false;
                UPDATE_VIEW();
            }

            function UPDATE_VIEW() {
                UPDATE_SCORES();
                const STATE = GET_STATE();
                MAIN_VIEW.innerHTML = '';
                OVERLAY.style.display = 'NONE';
                WARNING_MSG.style.display = 'NONE';
                TIME_UP_MSG.style.display = 'NONE';
                INVENTORY_BAR.style.display = 'NONE';
                HAS_WARNED = false;

                APPLY_SKILL(STATE);

                if (STATE.INVENTORY && STATE.INVENTORY.length > 0 && STATE.STATE === 'GUESSING') {
                    SHOW_INVENTORY();
                }

                if (STATE.STATE === 'WAITING') {
                    OVERLAY.style.display = 'FLEX';
                } else if (STATE.STATE === 'GUESSING' || STATE.WRONG_GUESSES >= 3) {
                    if (STATE.WRONG_GUESSES >= 3) {
                        SHOW_RESULT(false);
                        return;
                    }

                    const READY = document.createElement('H2');
                    READY.textContent = 'BẠN ĐÃ SẴN SÀNG ĐOÁN MÀU CHƯA?';
                    MAIN_VIEW.appendChild(READY);
                    const H = document.createElement('H2');
                    H.textContent = 'ĐOÁN ĐI NÀO!!!';
                    MAIN_VIEW.appendChild(H);

                    if (!HINT_USED) {
                        const HINT_BTN = CREATE_BUTTON('GỢI Ý (LOẠI 3 MÀU SAI)', () => {
                            if (HINT_USED) {
                                alert('BẠN ĐÃ DÙNG GỢI Ý RỒI!');
                                return;
                            }
                            HINT_USED = true;
                            UPDATE_VIEW();
                            alert('ĐÃ LOẠI BỎ 3 MÀU SAI! CHỌN LẠI ĐI!');
                        });
                        HINT_BTN.style.background = 'linear-gradient(#FFD700, #FFA500)';
                        MAIN_VIEW.appendChild(HINT_BTN);
                    }

                    MAIN_VIEW.appendChild(CREATE_PALETTE(STATE));

                    const SURRENDER = CREATE_BUTTON('TỪ BỎ (-10 ĐIỂM)', () => {
                        if ((STATE.PLAYER_SCORE || 0) < 10) {
                            alert('BẠN KHÔNG ĐỦ ĐIỂM ĐỂ TỪ BỎ');
                            return;
                        }
                        if (confirm('TỪ BỎ THẬT À? -10 ĐIỂM')) {
                            const NEW_STATE = {...STATE};
                            NEW_STATE.PLAYER_SCORE -= 10;
                            SET_STATE(NEW_STATE);
                            SHOW_RESULT(false);
                        }
                    });
                    SURRENDER.style.background = '#FF4444';
                    MAIN_VIEW.appendChild(SURRENDER);
                }
            }

            setInterval(() => {
                const STATE = GET_STATE();
                if (!STATE) return;

                if (STATE.STATE === 'WAITING') {
                    const ELAPSED = Date.now() - STATE.TIMER_START;
                    const REMAINING = STATE.TIMER_DURATION - ELAPSED;
                    if (REMAINING <= 0) {
                        const GUESS_DURATION = Math.floor(Math.random() * 540000) + 60000;
                        const NEW_STATE = {...STATE};
                        NEW_STATE.STATE = 'GUESSING';
                        NEW_STATE.GUESS_TIMER_START = Date.now();
                        NEW_STATE.GUESS_TIMER_DURATION = GUESS_DURATION;
                        SET_STATE(NEW_STATE);
                        UPDATE_VIEW();
                    } else {
                        const M = String(Math.floor(REMAINING / 60000)).padStart(2, '0');
                        const S = String(Math.floor((REMAINING % 60000) / 1000)).padStart(2, '0');
                        document.getElementById('WAIT-TIMER').textContent = M + ':' + S;
                    }
                } else if (STATE.STATE === 'GUESSING') {
                    const ELAPSED = Date.now() - STATE.GUESS_TIMER_START;
                    const REMAINING = Math.max(0, STATE.GUESS_TIMER_DURATION - ELAPSED);
                    const TOTAL_SECONDS = Math.floor(REMAINING / 1000);

                    if (TOTAL_SECONDS <= 10 && TOTAL_SECONDS > 5 && !HAS_WARNED) {
                        WARNING_MSG.style.display = 'BLOCK';
                        PLAY_SOUND('WARNING');
                        HAS_WARNED = true;
                    } else if (TOTAL_SECONDS <= 5) {
                        WARNING_MSG.style.color = '#FF0000';
                        WARNING_MSG.style.animation = 'BLINK 0.4s infinite';
                    }

                    if (REMAINING <= 0) {
                        TIME_UP_MSG.style.display = 'BLOCK';
                        PLAY_SOUND('WRONG');
                        setTimeout(() => {
                            SHOW_RESULT(false);
                        }, 2000);
                    }
                }
            }, 500);

            BOT_SET_COLOR_AND_WAIT();
        }
    </script>
</body>
</html>

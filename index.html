<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRÒ CHƠI ĐỐ MÀU</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const playerParam = params.get('player');
        let player = playerParam ? Number(playerParam) : null;

        const colors = [
            {name: 'ĐỎ', hex: '#FF0000'},
            {name: 'CAM', hex: '#FFA500'},
            {name: 'VÀNG', hex: '#FFFF00'},
            {name: 'XANH LÁ', hex: '#00FF00'},
            {name: 'XANH DƯƠNG', hex: '#0000FF'},
            {name: 'TÍM', hex: '#800080'},
            {name: 'HỒNG', hex: '#FFC0CB'},
            {name: 'NÂU', hex: '#A52A2A'},
            {name: 'ĐEN', hex: '#000000'},
            {name: 'TRẮNG', hex: '#FFFFFF'},
            {name: 'XÁM', hex: '#808080'},
            {name: 'XANH NGỌC', hex: '#00FFFF'},
            {name: 'HỒNG PHẤN', hex: '#FF69B4'},
            {name: 'VÀNG KIM', hex: '#FFD700'},
            {name: 'NAVY', hex: '#000080'},
            {name: 'ĐỎ RƯỢU', hex: '#8B0000'},
            {name: 'OLIVE', hex: '#808000'},
            {name: 'TEAL', hex: '#008080'},
            {name: 'VIOLET', hex: '#EE82EE'},
            {name: 'CORAL', hex: '#FF7F50'},
        ];

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume();
            }
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            const gain = audioCtx.createGain();
            gain.gain.value = 0.3;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.7);
            } else {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(200, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        const STATE_KEY = 'colorGameStateV3';

        function getState() {
            const s = localStorage.getItem(STATE_KEY);
            return s ? JSON.parse(s) : null;
        }

        function setState(state) {
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }

        function getTextColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const luma = 0.299 * r + 0.587 * g + 0.114 * b;
            return luma > 186 ? '#000000' : '#FFFFFF';
        }

        function createButton(text, onclick) {
            const btn = document.createElement('BUTTON');
            btn.textContent = text;
            btn.classList.add('BTN');
            btn.onclick = () => {
                initAudio();
                onclick();
            };
            return btn;
        }

        function createFooter(parent) {
            const footer = document.createElement('FOOTER');
            const lines = [
                'MADE IN VN 🇻🇳',
                'MADE BY : NGUYỄN CHÍ DỰ ♥️🇻🇳',
                'GMAIL HỖ TRỢ : Herogoodboymc2024@gmail.com'
            ];
            lines.forEach(line => {
                const p = document.createElement('P');
                p.textContent = line;
                footer.appendChild(p);
            });
            const reportBtn = createButton('BÁO CÁO LỖI', () => {
                document.getElementById('BUG-MODAL').style.display = 'BLOCK';
            });
            footer.appendChild(reportBtn);
            parent.appendChild(footer);
        }

        if (!player) {
            // TRANG CHỦ
            document.body.innerHTML = '';
            const container = document.createElement('DIV');
            container.id = 'CONTAINER';
            document.body.appendChild(container);

            const header = document.createElement('HEADER');
            const title = document.createElement('H1');
            title.textContent = 'TRÒ CHƠI ĐỐ MÀU';
            header.appendChild(title);

            const subtitle = document.createElement('P');
            subtitle.textContent = 'CHÚC CÁC BẠN CHƠI VUI VẺ CÓ LỖI KÉO XUỐNG DƯỚI CHÂN TRANG BẤM VÀO NÚT BÁO CÁO NHA :)';
            subtitle.classList.add('SUBTITLE');
            header.appendChild(subtitle);
            container.appendChild(header);

            const main = document.createElement('DIV');
            main.classList.add('HOME-MAIN');

            const info = document.createElement('P');
            info.textContent = 'MỞ 2 TAB HOẶC 2 THIẾT BỊ ĐỂ CHƠI VỚI NHAU NHÉ!';
            info.style.fontWeight = 'BOLD';
            info.style.color = '#FFFF00';
            info.style.fontSize = '1.8EM';
            main.appendChild(info);

            const btn1 = createButton('TÔI LÀ PLAYER 1 (ĐẶT MÀU ĐẦU TIÊN)', () => {
                if (confirm('BẠN SẴN SÀNG CHƠI CHƯA?')) {
                    window.open(location.pathname + '?player=1', '_blank');
                }
            });
            btn1.classList.add('LARGE');
            main.appendChild(btn1);

            const btn2 = createButton('TÔI LÀ PLAYER 2 (ĐOÁN MÀU)', () => {
                if (confirm('BẠN SẴN SÀNG CHƠI CHƯA?')) {
                    window.open(location.pathname + '?player=2', '_blank');
                }
            });
            btn2.classList.add('LARGE');
            main.appendChild(btn2);

            container.appendChild(main);
            createFooter(container);

            // MODAL BÁO LỖI
            const modal = document.createElement('DIV');
            modal.id = 'BUG-MODAL';
            const h = document.createElement('H2');
            h.textContent = 'BÁO CÁO LỖI';
            modal.appendChild(h);

            const inputs = ['TÊN CỦA BẠN (BẮT BUỘC)', 'GMAIL CỦA BẠN (BẮT BUỘC)', 'MÔ TẢ LỖI (BẮT BUỘC)'];
            const fields = [];
            inputs.forEach(placeholder => {
                const input = document.createElement(placeholder.includes('MÔ TẢ') ? 'TEXTAREA' : 'INPUT');
                input.placeholder = placeholder;
                if (placeholder.includes('MÔ TẢ')) input.rows = 6;
                modal.appendChild(input);
                fields.push(input);
            });

            const send = createButton('GỬI BÁO CÁO', () => {
                if (fields.every(f => f.value.trim())) {
                    alert('CẢM ƠN BẠN ĐÃ BÁO CÁO! MÌNH SẼ SỬA NGAY NHA 😊');
                    modal.style.display = 'NONE';
                    fields.forEach(f => f.value = '');
                } else {
                    alert('BẠN BẮT BUỘC PHẢI NHẬP ĐẦY ĐỦ MỚI GỬI ĐƯỢC NHA');
                }
            });
            modal.appendChild(send);

            const close = createButton('ĐÓNG', () => modal.style.display = 'NONE');
            modal.appendChild(close);

            document.body.appendChild(modal);
        } else {
            // TRANG CHƠI
            document.body.innerHTML = '';
            const container = document.createElement('DIV');
            container.id = 'CONTAINER';
            document.body.appendChild(container);

            const header = document.createElement('DIV');
            header.classList.add('GAME-HEADER');
            const title = document.createElement('H1');
            title.textContent = 'TRÒ CHƠI ĐỐ MÀU - PLAYER ' + player;
            header.appendChild(title);

            const backBtn = createButton('TRỞ VỀ TRANG CHỦ', () => {
                if (confirm('THOÁT KHỎI TRÒ CHƠI? (KHÔNG TRỪ ĐIỂM)')) {
                    location.href = location.pathname;
                }
            });
            header.appendChild(backBtn);

            const resetBtn = createButton('RESET ĐIỂM', () => {
                if (confirm('RESET ĐIỂM CỦA CẢ HAI VỀ 0?')) {
                    const state = getState() || {scores: {1:0,2:0}};
                    state.scores = {1:0, 2:0};
                    setState(state);
                    updateView();
                }
            });
            header.appendChild(resetBtn);

            container.appendChild(header);

            const scoreBoard = document.createElement('DIV');
            scoreBoard.id = 'SCORE-BOARD';
            const p1 = document.createElement('DIV');
            p1.id = 'P1-SCORE';
            const p2 = document.createElement('DIV');
            p2.id = 'P2-SCORE';
            scoreBoard.appendChild(p1);
            scoreBoard.appendChild(p2);
            container.appendChild(scoreBoard);

            const mainView = document.createElement('DIV');
            mainView.id = 'MAIN-VIEW';
            container.appendChild(mainView);

            const overlay = document.createElement('DIV');
            overlay.id = 'OVERLAY';
            const waitText = document.createElement('DIV');
            waitText.textContent = 'VUI LÒNG ĐỢI BÊN KIA ĐẶT MÀU XONG...';
            waitText.classList.add('BLINK');
            const readyText = document.createElement('DIV');
            readyText.textContent = 'BẠN ĐÃ SẴN SÀNG ĐOÁN MÀU CHƯA?';
            readyText.style.display = 'NONE';
            readyText.style.fontSize = '3EM';
            readyText.style.marginTop = '30PX';
            const timerDiv = document.createElement('DIV');
            timerDiv.id = 'TIMER';
            overlay.appendChild(waitText);
            overlay.appendChild(readyText);
            overlay.appendChild(timerDiv);
            document.body.appendChild(overlay);

            createFooter(container);

            let selectedColor = null;

            function updateScores() {
                const state = getState() || {scores: {1:0,2:0}};
                document.getElementById('P1-SCORE').textContent = `PLAYER 1: ${state.scores[1] || 0} ĐIỂM`;
                document.getElementById('P2-SCORE').textContent = `PLAYER 2: ${state.scores[2] || 0} ĐIỂM`;
            }

            function createPalette(isSetting) {
                const grid = document.createElement('DIV');
                grid.classList.add('COLOR-GRID');
                colors.forEach(c => {
                    const btn = document.createElement('BUTTON');
                    btn.classList.add('COLOR-BTN');
                    btn.style.backgroundColor = c.hex;
                    btn.style.color = getTextColor(c.hex);
                    btn.textContent = c.name;
                    if (isSetting) {
                        btn.onclick = () => {
                            selectedColor = c.hex;
                            grid.querySelectorAll('.COLOR-BTN').forEach(b => b.classList.remove('SELECTED'));
                            btn.classList.add('SELECTED');
                        };
                    } else {
                        btn.onclick = () => {
                            const state = getState();
                            if (c.hex === state.secretColor) {
                                playSound('correct');
                                const newState = {...state};
                                newState.scores[player] += 10;
                                setState(newState);
                                showResult(true, 'ỐI TRỜI ƠI! ĐOÁN ĐÚNG RỒI!!! +10 ĐIỂM 🎉🎉');
                            } else {
                                playSound('wrong');
                                const newState = {...state};
                                newState.scores[player] -= 10;
                                newState.wrongGuesses = (newState.wrongGuesses || 0) + 1;
                                setState(newState);
                                alert('TẠI SAO LẠI CHỌN SAI THẾ NÀY??? -10 ĐIỂM 😭');
                                updateView();
                            }
                        };
                    }
                    grid.appendChild(btn);
                });
                return grid;
            }

            function showResult(correct, message) {
                mainView.innerHTML = '';
                const msg = document.createElement('H2');
                msg.textContent = message;
                msg.style.color = correct ? '#00FF00' : '#FF4444';
                mainView.appendChild(msg);

                const nextBtn = createButton('CHUYỂN LƯỢT - PLAYER ' + (3 - player) + ' ĐẶT MÀU', () => {
                    const state = getState();
                    const newState = {...state};
                    newState.currentSetter = 3 - player;
                    newState.state = 'SETTING';
                    newState.secretColor = null;
                    newState.wrongGuesses = 0;
                    setState(newState);
                    updateView();
                });
                nextBtn.classList.add('LARGE');
                mainView.appendChild(nextBtn);
            }

            function updateView() {
                updateScores();
                const state = getState();
                if (!state) {
                    setState({
                        currentSetter: 1,
                        state: 'SETTING',
                        scores: {1:0,2:0},
                        wrongGuesses: 0
                    });
                    updateView();
                    return;
                }

                const isSetter = player === state.currentSetter;
                mainView.innerHTML = '';
                overlay.style.display = 'NONE';
                waitText.style.display = 'BLOCK';
                readyText.style.display = 'NONE';
                document.getElementById('TIMER').textContent = '';

                if (state.state === 'SETTING') {
                    if (isSetter) {
                        const h = document.createElement('H2');
                        h.textContent = 'BẠN ĐẶT MÀU - CHỌN MÀU BÍ MẬT ĐI!';
                        mainView.appendChild(h);
                        selectedColor = null;
                        mainView.appendChild(createPalette(true));

                        const confirmBtn = createButton('XÁC NHẬN ĐẶT MÀU XONG', () => {
                            if (!selectedColor) return alert('CHỌN MÀU ĐI BẠN ƠI!');
                            const newState = {...state};
                            newState.secretColor = selectedColor;
                            newState.state = 'WAITING';
                            newState.timerStart = Date.now();
                            newState.timerDuration = Math.floor(Math.random() * 240000) + 60000; // 1-5 phút
                            setState(newState);
                            updateView();
                        });
                        confirmBtn.classList.add('LARGE');
                        mainView.appendChild(confirmBtn);
                    } else {
                        const h = document.createElement('H2');
                        h.textContent = 'CHỜ PLAYER ' + state.currentSetter + ' ĐẶT MÀU...';
                        mainView.appendChild(h);
                    }
                } else if (state.state === 'WAITING') {
                    overlay.style.display = 'FLEX';
                    if (isSetter) {
                        const h = document.createElement('H2');
                        h.textContent = 'ĐÃ ĐẶT XONG - CHỜ THỜI GIAN NGẪU NHIÊN...';
                        mainView.appendChild(h);
                    }
                } else if (state.state === 'GUESSING') {
                    overlay.style.display = 'FLEX';
                    waitText.style.display = 'NONE';
                    readyText.style.display = 'BLOCK';

                    if (!isSetter) {
                        mainView.innerHTML = '';
                        const h = document.createElement('H2');
                        h.textContent = 'ĐOÁN MÀU ĐI NÀO!!!';
                        mainView.appendChild(h);
                        mainView.appendChild(createPalette(false));

                        const surrender = createButton('TỪ BỎ (-10 ĐIỂM)', () => {
                            if (confirm('TỪ BỎ THẬT À? -10 ĐIỂM NHÉ')) {
                                const newState = {...state};
                                newState.scores[player] -= 10;
                                setState(newState);
                                showResult(false, 'BẠN ĐÃ TỪ BỎ LƯỢT ĐOÁN');
                            }
                        });
                        surrender.style.background = '#FF4444';
                        mainView.appendChild(surrender);

                        if (state.wrongGuesses >= 3) {
                            const restart = createButton('CHƠI LẠI LƯỢT (SAI QUÁ 3 LẦN)', () => {
                                if (confirm('CHƠI LẠI LƯỢT NÀY NHÉ?')) {
                                    const newState = {...state};
                                    newState.state = 'SETTING';
                                    newState.secretColor = null;
                                    newState.wrongGuesses = 0;
                                    setState(newState);
                                    updateView();
                                }
                            });
                            restart.style.background = '#FF9800';
                            mainView.appendChild(restart);
                        }
                    } else {
                        const h = document.createElement('H2');
                        h.textContent = 'CHỜ PLAYER ' + (3-player) + ' ĐOÁN...';
                        mainView.appendChild(h);
                    }
                }
            }

            window.addEventListener('storage', (e) => {
                if (e.key === STATE_KEY) updateView();
            });

            setInterval(() => {
                const state = getState();
                if (state && state.state === 'WAITING') {
                    const elapsed = Date.now() - state.timerStart;
                    const remaining = state.timerDuration - elapsed;
                    if (remaining <= 0) {
                        const newState = {...state};
                        newState.state = 'GUESSING';
                        setState(newState);
                        updateView();
                    } else {
                        const m = String(Math.floor(remaining / 60000)).padStart(2, '0');
                        const s = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
                        document.getElementById('TIMER').textContent = m + ':' + s;
                    }
                }
            }, 500);

            updateView();
        }
    </script>
</body>
</html>

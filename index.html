<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRÒ CHƠI ĐỐ MÀU</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const playerParam = params.get('player');
        let player = playerParam ? Number(playerParam) : null;

        const COLORS = [
            {name: 'ĐỎ', hex: '#FF0000'},
            {name: 'CAM', hex: '#FFA500'},
            {name: 'VÀNG', hex: '#FFFF00'},
            {name: 'XANH LÁ', hex: '#00FF00'},
            {name: 'XANH DƯƠNG', hex: '#0000FF'},
            {name: 'TÍM', hex: '#800080'},
            {name: 'HỒNG', hex: '#FFC0CB'},
            {name: 'NÂU', hex: '#A52A2A'},
            {name: 'ĐEN', hex: '#000000'},
            {name: 'TRẮNG', hex: '#FFFFFF'},
            {name: 'XÁM', hex: '#808080'},
            {name: 'XANH NGỌC', hex: '#00FFFF'},
            {name: 'HỒNG PHẤN', hex: '#FF69B4'},
            {name: 'VÀNG KIM', hex: '#FFD700'},
            {name: 'NAVY', hex: '#000080'},
            {name: 'ĐỎ RƯỢU', hex: '#8B0000'},
            {name: 'OLIVE', hex: '#808000'},
            {name: 'TEAL', hex: '#008080'},
            {name: 'VIOLET', hex: '#EE82EE'},
            {name: 'CORAL', hex: '#FF7F50'},
        ];

        const SOUNDS = {
            correct: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_4e79e3c6d3.mp3?filename=success-1-6297.mp3',
            wrong: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_8c8b6d1f3f.mp3?filename=wrong-answer-129254.mp3',
            victory: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_3d7c5a3a3e.mp3?filename=fanfare-6302.mp3',
            buy: 'https://cdn.pixabay.com/download/audio/2022/05/13/audio_8c3e3d3e4f.mp3?filename=cash-register-172293.mp3',
            warning: 'https://cdn.pixabay.com/download/audio/2023/08/22/audio_9d8e3b3e4f.mp3?filename=alarm-clock-64535.mp3',
            fail: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_8c8b6d1f3f.mp3?filename=wrong-answer-129254.mp3'
        };

        function playSound(type) {
            const audio = new Audio(SOUNDS[type] || SOUNDS.correct);
            audio.volume = 0.6;
            audio.play().catch(() => {});
        }

        const STATE_KEY = 'COLORGAME2026';

        function getState() {
            const s = localStorage.getItem(STATE_KEY);
            return s ? JSON.parse(s) : {playerScore: 0, inventory: []};
        }

        function setState(state) {
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }

        function getTextColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const luma = 0.299 * r + 0.587 * g + 0.114 * b;
            return luma > 186 ? '#000000' : '#FFFFFF';
        }

        function createButton(text, onclick) {
            const btn = document.createElement('BUTTON');
            btn.textContent = text;
            btn.classList.add('BTN');
            btn.onclick = onclick;
            return btn;
        }

        function createFooter(parent) {
            const footer = document.createElement('FOOTER');
            const lines = [
                'MADE IN VN 🇻🇳',
                'MADE BY : NGUYỄN CHÍ DỰ ♥️🇻🇳',
                'GMAIL HỖ TRỢ : Herogoodboymc2024@gmail.com'
            ];
            lines.forEach(line => {
                const p = document.createElement('P');
                p.textContent = line;
                footer.appendChild(p);
            });
            const reportBtn = createButton('BÁO CÁO LỖI', () => {
                document.getElementById('BUG-MODAL').style.display = 'block';
            });
            footer.appendChild(reportBtn);
            parent.appendChild(footer);
        }

        const shopItems = [
            {id: 'reveal', name: 'MẮT NHÌN XUYÊN THẤU', desc: 'NHÌN THẤY MÀU ĐÚNG TRONG 10 GIÂY', price: 100000},
            {id: 'hint3', name: 'GỢI Ý 3 MÀU SAI', desc: 'LOẠI BỎ 3 MÀU SAI KHỎI BẢNG', price: 50000},
            {id: 'extraTime', name: 'THỜI GIAN THÊM', desc: '+3 PHÚT ĐẾM NGƯỢC', price: 40000},
            {id: 'halfWrong', name: 'GIẢM NỬA SAI', desc: 'GIẢM 1/2 SỐ LẦN SAI ĐÃ CÓ', price: 35000},
            {id: 'doublePoint', name: 'NHÂN ĐÔI ĐIỂM', desc: 'ĐOÁN ĐÚNG LẦN NÀY +200 ĐIỂM', price: 80000},
        ];

        if (!player) {
            document.body.innerHTML = '';
            const container = document.createElement('DIV');
            container.id = 'CONTAINER';
            document.body.appendChild(container);

            const header = document.createElement('HEADER');
            const title = document.createElement('H1');
            title.textContent = 'TRÒ CHƠI ĐỐ MÀU';
            header.appendChild(title);

            const subtitle = document.createElement('P');
            subtitle.textContent = 'CHÚC CÁC BẠN CHƠI VUI VẺ CÓ LỖI KÉO XUỐNG DƯỚI CHÂN TRANG BẤM VÀO NÚT BÁO CÁO NHA :)';
            subtitle.classList.add('SUBTITLE');
            header.appendChild(subtitle);
            container.appendChild(header);

            const main = document.createElement('DIV');
            main.classList.add('HOME-MAIN');

            const currentScore = getState().playerScore || 0;
            const scoreInfo = document.createElement('P');
            scoreInfo.textContent = `ĐIỂM HIỆN TẠI CỦA BẠN: ${currentScore.toLocaleString()}`;
            scoreInfo.style.fontWeight = 'BOLD';
            scoreInfo.style.color = '#FFFF00';
            scoreInfo.style.fontSize = '2.2EM';
            scoreInfo.style.marginBottom = '30PX';
            main.appendChild(scoreInfo);

            const info = document.createElement('P');
            info.textContent = 'PLAYER 1 LÀ BOT - BẠN LÀ NGƯỜI ĐOÁN MÀU!';
            info.style.fontWeight = 'BOLD';
            info.style.color = '#FFFF00';
            info.style.fontSize = '2EM';
            main.appendChild(info);

            const startBtn = createButton('BẮT ĐẦU CHƠI VỚI BOT', () => {
                location.href = location.pathname + '?player=2';
            });
            startBtn.classList.add('LARGE');
            main.appendChild(startBtn);

            container.appendChild(main);
            createFooter(container);

            const modal = document.createElement('DIV');
            modal.id = 'BUG-MODAL';
            const h = document.createElement('H2');
            h.textContent = 'BÁO CÁO LỖI';
            modal.appendChild(h);

            const inputs = ['TÊN CỦA BẠN (BẮT BUỘC)', 'GMAIL CỦA BẠN (BẮT BUỘC)', 'MÔ TẢ LỖI (BẮT BUỘC)'];
            const fields = [];
            inputs.forEach(placeholder => {
                const input = document.createElement(placeholder.includes('MÔ TẢ') ? 'TEXTAREA' : 'INPUT');
                input.placeholder = placeholder;
                if (placeholder.includes('MÔ TẢ')) input.rows = 6;
                modal.appendChild(input);
                fields.push(input);
            });

            const send = createButton('GỬI BÁO CÁO', () => {
                if (fields.every(f => f.value.trim())) {
                    alert('CẢM ƠN BẠN ĐÃ BÁO CÁO! MÌNH SẼ SỬA NGAY NHA 😊');
                    modal.style.display = 'none';
                    fields.forEach(f => f.value = '');
                } else {
                    alert('BẠN BẮT BUỘC PHẢI NHẬP ĐẦY ĐỦ MỚI GỬI ĐƯỢC NHA');
                }
            });
            modal.appendChild(send);

            const close = createButton('ĐÓNG', () => modal.style.display = 'none');
            modal.appendChild(close);

            document.body.appendChild(modal);
        } else if (player === 2) {
            document.body.innerHTML = '';
            const container = document.createElement('DIV');
            container.id = 'CONTAINER';
            document.body.appendChild(container);

            const header = document.createElement('DIV');
            header.classList.add('GAME-HEADER');
            const title = document.createElement('H1');
            title.textContent = 'TRÒ CHƠI ĐỐ MÀU - BẠN VS BOT';
            header.appendChild(title);

            const shopBtn = createButton('CỬA HÀNG SKILL', () => {
                showShop();
            });
            shopBtn.classList.add('SHOP-BTN');
            header.appendChild(shopBtn);

            const backBtn = createButton('TRỞ VỀ TRANG CHỦ', () => {
                if (confirm('THOÁT KHỎI TRÒ CHƠI?')) {
                    location.href = location.pathname;
                }
            });
            header.appendChild(backBtn);

            const resetBtn = createButton('RESET ĐIỂM', () => {
                if (confirm('RESET ĐIỂM CỦA BẠN VỀ 0? (KHÔNG THỂ HOÀN TÁC)')) {
                    const newState = {playerScore: 0, inventory: []};
                    setState(newState);
                    updateView();
                    alert('ĐIỂM ĐÃ ĐƯỢC RESET VỀ 0!');
                }
            });
            header.appendChild(resetBtn);

            const infoBtn = createButton('ℹ️ THÔNG TIN & UPDATE', () => {
                document.getElementById('INFO-MODAL').style.display = 'block';
            });
            header.appendChild(infoBtn);

            container.appendChild(header);

            const scoreBoard = document.createElement('DIV');
            scoreBoard.id = 'SCORE-BOARD';
            const playerScore = document.createElement('DIV');
            playerScore.id = 'PLAYER-SCORE';
            scoreBoard.appendChild(playerScore);
            container.appendChild(scoreBoard);

            const mainView = document.createElement('DIV');
            mainView.id = 'MAIN-VIEW';
            container.appendChild(mainView);

            const overlay = document.createElement('DIV');
            overlay.id = 'OVERLAY';
            const waitText = document.createElement('DIV');
            waitText.textContent = 'BOT ĐANG ĐẶT MÀU BÍ MẬT...';
            waitText.classList.add('BLINK');
            const waitTimer = document.createElement('DIV');
            waitTimer.id = 'WAIT-TIMER';
            overlay.appendChild(waitText);
            overlay.appendChild(waitTimer);
            document.body.appendChild(overlay);

            const checkOverlay = document.createElement('DIV');
            checkOverlay.id = 'CHECK-OVERLAY';
            checkOverlay.style.display = 'none';
            const checkText = document.createElement('DIV');
            checkText.textContent = '⏰ ĐANG KIỂM TRA MÀU VUI LÒNG ĐỢI ⏰';
            checkText.style.fontSize = 'clamp(2em, 6vw, 3.5em)';
            checkText.style.fontWeight = 'bold';
            checkText.style.color = '#FFD700';
            checkText.style.textShadow = '0 0 20px #000';
            checkOverlay.appendChild(checkText);
            document.body.appendChild(checkOverlay);

            const warningMsg = document.createElement('DIV');
            warningMsg.id = 'WARNING-MSG';
            warningMsg.textContent = '🚨 NHANH LÊN THỜI GIAN SẮP HẾT, HẾT LÀ BẠN THUA ĐÓ! 🚨';
            warningMsg.style.display = 'none';
            document.body.appendChild(warningMsg);

            const timeUpMsg = document.createElement('DIV');
            timeUpMsg.id = 'TIME-UP-MSG';
            timeUpMsg.textContent = 'THỜI GIAN HẾT!';
            timeUpMsg.style.display = 'none';
            document.body.appendChild(timeUpMsg);

            const shopModal = document.createElement('DIV');
            shopModal.id = 'SHOP-MODAL';
            document.body.appendChild(shopModal);

            const inventoryBar = document.createElement('DIV');
            inventoryBar.id = 'INVENTORY-BAR';
            inventoryBar.style.display = 'none';
            document.body.appendChild(inventoryBar);

            const infoModal = document.createElement('DIV');
            infoModal.id = 'INFO-MODAL';
            infoModal.style.display = 'none';
            const infoTitle = document.createElement('H2');
            infoTitle.textContent = 'ℹ️ THÔNG TIN & UPDATE';
            infoModal.appendChild(infoTitle);

            const infoContent = document.createElement('P');
            infoContent.innerHTML = `
                <strong>CẬP NHẬT MỚI NHẤT:</strong><br><br>
                • Bot đặt màu bí mật chỉ trong <strong>30 GIÂY</strong> (cố định).<br>
                • Đoán đúng +<strong>100 ĐIỂM</strong> (nhân đôi thành 200 nếu dùng skill).<br>
                • Đoán sai / Từ bỏ -<strong>50 ĐIỂM</strong>.<br>
                • Khi chọn màu sẽ có popup "ĐANG KIỂM TRA MÀU" trong 3 giây.<br>
                • <strong>THÊM GỢI Ý</strong>: Bấm nút "GỢI Ý" để loại bỏ 3 màu sai (miễn phí 1 lần/lượt).<br>
                • Nút "CHƠI LẠI VỚI BOT" có xác nhận tránh bấm nhầm.<br>
                • Bấm "BẮT ĐẦU CHƠI VỚI BOT" ở trang chủ là vào chơi luôn (không xác nhận).<br>
                • Không còn timer đếm ngược khi đoán, chỉ hiện cảnh báo khi sắp hết giờ.<br>
                • Giao diện tối ưu cho mọi thiết bị (PC, Android, iOS).<br><br>
                CHƠI VUI VẺ NHÉ! 🎉
            `;
            infoModal.appendChild(infoContent);

            const closeInfo = createButton('ĐÓNG', () => infoModal.style.display = 'none');
            infoModal.appendChild(closeInfo);

            document.body.appendChild(infoModal);

            createFooter(container);

            let hasWarned = false;
            let hintUsed = false;

            function updateScores() {
                const state = getState();
                document.getElementById('PLAYER-SCORE').textContent = `ĐIỂM CỦA BẠN: ${state.playerScore.toLocaleString()}`;
            }

            function showShop() {
                const state = getState();
                shopModal.innerHTML = '';
                shopModal.style.display = 'block';

                const title = document.createElement('H2');
                title.textContent = 'CỬA HÀNG SKILL';
                shopModal.appendChild(title);

                const currentPoint = document.createElement('P');
                currentPoint.textContent = `ĐIỂM HIỆN TẠI: ${state.playerScore.toLocaleString()}`;
                currentPoint.style.fontSize = '1.8EM';
                currentPoint.style.color = '#FFFF00';
                shopModal.appendChild(currentPoint);

                shopItems.forEach(item => {
                    const card = document.createElement('DIV');
                    card.classList.add('SHOP-ITEM');

                    const name = document.createElement('H3');
                    name.textContent = item.name;
                    card.appendChild(name);

                    const desc = document.createElement('P');
                    desc.textContent = item.desc;
                    card.appendChild(desc);

                    const price = document.createElement('P');
                    price.textContent = `GIÁ: ${item.price.toLocaleString()} ĐIỂM`;
                    price.style.color = '#FF4444';
                    price.style.fontWeight = 'BOLD';
                    card.appendChild(price);

                    const buyBtn = createButton('MUA NGAY', () => {
                        if (state.playerScore < item.price) {
                            playSound('fail');
                            alert('XIN LỖI BẠN, BẠN KHÔNG ĐỦ ĐIỂM ĐỂ MUA SKILL NÀY. VUI LÒNG CÀY ĐỦ ĐIỂM VÀ MUA LẠI NHÉ');
                            return;
                        }
                        if (confirm(`MUA ${item.name} VỚI ${item.price.toLocaleString()} ĐIỂM?`)) {
                            playSound('buy');
                            const newState = {...state};
                            newState.playerScore -= item.price;
                            newState.inventory.push(item.id);
                            setState(newState);
                            alert('MUA THÀNH CÔNG! SKILL ĐÃ VÀO TÚI ĐỒ!');
                            shopModal.style.display = 'none';
                            updateView();
                        }
                    });
                    card.appendChild(buyBtn);

                    shopModal.appendChild(card);
                });

                const closeBtn = createButton('ĐÓNG CỬA HÀNG', () => shopModal.style.display = 'none');
                shopModal.appendChild(closeBtn);
            }

            function showInventory() {
                const state = getState();
                inventoryBar.innerHTML = '';
                inventoryBar.style.display = 'flex';

                const title = document.createElement('P');
                title.textContent = 'TÚI ĐỒ SKILL:';
                title.style.marginRight = '10PX';
                inventoryBar.appendChild(title);

                shopItems.forEach(item => {
                    if (state.inventory.includes(item.id)) {
                        const useBtn = createButton(item.name, () => {
                            if (state.activeSkill && state.activeSkill.id === item.id) {
                                alert('SKILL NÀY ĐÃ ĐƯỢC KÍCH HOẠT RỒI!');
                                return;
                            }
                            const newState = {...state};
                            newState.activeSkill = {id: item.id};
                            newState.inventory = newState.inventory.filter(i => i !== item.id);
                            setState(newState);
                            alert(`ĐÃ KÍCH HOẠT ${item.name}!`);
                            updateView();
                        });
                        useBtn.classList.add('INVENTORY-BTN');
                        inventoryBar.appendChild(useBtn);
                    }
                });
            }

            function applySkill(state) {
                if (!state.activeSkill) return false;
                return true;
            }

            function createPalette(state) {
                const wrapper = document.createElement('DIV');
                wrapper.classList.add('COLOR-WRAPPER');

                let availableColors = COLORS.slice();
                if (state.activeSkill && state.activeSkill.id === 'hint3' && applySkill(state)) {
                    let wrongColors = COLORS.filter(c => c.hex !== state.secretColor);
                    wrongColors.sort(() => Math.random() - 0.5);
                    const toRemove = wrongColors.slice(0, 3).map(c => c.hex);
                    availableColors = COLORS.filter(c => !toRemove.includes(c.hex));
                }

                availableColors.forEach(c => {
                    const btn = document.createElement('BUTTON');
                    btn.classList.add('COLOR-BTN');
                    btn.style.backgroundColor = c.hex;
                    btn.style.color = getTextColor(c.hex);
                    btn.textContent = c.name;

                    if (state.activeSkill && state.activeSkill.id === 'reveal' && applySkill(state)) {
                        if (c.hex === state.secretColor) {
                            btn.classList.add('REVEAL');
                        }
                    }

                    btn.onclick = () => {
                        document.getElementById('CHECK-OVERLAY').style.display = 'flex';

                        setTimeout(() => {
                            document.getElementById('CHECK-OVERLAY').style.display = 'none';

                            if (c.hex === state.secretColor) {
                                playSound('correct');
                                playSound('victory');
                                let bonus = 100;
                                if (state.activeSkill && state.activeSkill.id === 'doublePoint' && applySkill(state)) bonus = 200;
                                const newState = {...state};
                                newState.playerScore += bonus;
                                delete newState.activeSkill;
                                setState(newState);
                                showResult(true, bonus);
                            } else {
                                playSound('wrong');
                                const currentScore = state.playerScore || 0;
                                const penalty = 50;
                                const newState = {...state};
                                newState.playerScore = Math.max(0, currentScore - penalty);
                                newState.wrongGuesses += 1;
                                setState(newState);
                                alert(`SAI RỒI!!! -${penalty} ĐIỂM 😭`);
                                updateView();
                            }
                        }, 3000);
                    };
                    wrapper.appendChild(btn);
                });
                return wrapper;
            }

            function showResult(correct, bonus = 100) {
                mainView.innerHTML = '';
                const msg = document.createElement('H2');
                msg.textContent = correct ? `CHÚC MỪNG! +${bonus} ĐIỂM 🎉🎉` : 'HẾT GIỜ HOẶC SAI QUÁ 3 LẦN - BẠN THUA RỒI!';
                msg.style.color = correct ? '#00FF00' : '#FF4444';
                mainView.appendChild(msg);

                const nextBtn = createButton('CHƠI LẠI VỚI BOT', () => {
                    if (confirm('BẠN MUỐN CHƠI LẠI VỚI BOT THẬT CHỨ? (ĐIỂM VÀ TÚI ĐỒ GIỮ NGUYÊN)')) {
                        botSetColorAndWait();
                    }
                });
                nextBtn.classList.add('LARGE');
                mainView.appendChild(nextBtn);
            }

            function botSetColorAndWait() {
                const secret = COLORS[Math.floor(Math.random() * COLORS.length)].hex;
                const waitDuration = 30000;
                const state = getState();
                const newState = {
                    secretColor: secret,
                    state: 'WAITING',
                    timerStart: Date.now(),
                    timerDuration: waitDuration,
                    playerScore: state.playerScore,
                    inventory: state.inventory || [],
                    wrongGuesses: 0
                };
                setState(newState);
                hintUsed = false;
                updateView();
            }

            function updateView() {
                updateScores();
                const state = getState();
                mainView.innerHTML = '';
                overlay.style.display = 'none';
                document.getElementById('CHECK-OVERLAY').style.display = 'none';
                warningMsg.style.display = 'none';
                timeUpMsg.style.display = 'none';
                inventoryBar.style.display = 'none';
                hasWarned = false;

                if (state.inventory && state.inventory.length > 0 && state.state === 'GUESSING') {
                    showInventory();
                }

                if (state.state === 'WAITING') {
                    overlay.style.display = 'flex';
                } else if (state.state === 'GUESSING' || state.wrongGuesses >= 3) {
                    if (state.wrongGuesses >= 3) {
                        showResult(false);
                        return;
                    }

                    const ready = document.createElement('H2');
                    ready.textContent = 'BẠN ĐÃ SẴN SÀNG ĐOÁN MÀU CHƯA?';
                    mainView.appendChild(ready);
                    const h = document.createElement('H2');
                    h.textContent = 'ĐOÁN ĐI NÀO!!!';
                    mainView.appendChild(h);

                    if (!hintUsed) {
                        const hintBtn = createButton('GỢI Ý (LOẠI 3 MÀU SAI)', () => {
                            if (hintUsed) {
                                alert('BẠN ĐÃ DÙNG GỢI Ý RỒI!');
                                return;
                            }
                            hintUsed = true;
                            updateView();
                            alert('ĐÃ LOẠI BỎ 3 MÀU SAI! CHỌN LẠI ĐI!');
                        });
                        hintBtn.style.background = 'linear-gradient(#FFD700, #FFA500)';
                        mainView.appendChild(hintBtn);
                    }

                    mainView.appendChild(createPalette(state));

                    const surrender = createButton('TỪ BỎ (-50 ĐIỂM)', () => {
                        if ((state.playerScore || 0) < 50) {
                            alert('BẠN KHÔNG ĐỦ ĐIỂM ĐỂ TỪ BỎ');
                            return;
                        }
                        if (confirm('TỪ BỎ THẬT À? -50 ĐIỂM')) {
                            const newState = {...state};
                            newState.playerScore -= 50;
                            setState(newState);
                            showResult(false);
                        }
                    });
                    surrender.style.background = '#FF4444';
                    mainView.appendChild(surrender);
                }
            }

            setInterval(() => {
                const state = getState();
                if (!state || !state.state) return;

                if (state.state === 'WAITING') {
                    const elapsed = Date.now() - state.timerStart;
                    const remaining = state.timerDuration - elapsed;
                    if (remaining <= 0) {
                        const guessDuration = Math.floor(Math.random() * 540000) + 60000;
                        const newState = {...state};
                        newState.state = 'GUESSING';
                        newState.guessTimerStart = Date.now();
                        newState.guessTimerDuration = guessDuration;
                        setState(newState);
                        updateView();
                    } else {
                        const m = String(Math.floor(remaining / 60000)).padStart(2, '0');
                        const s = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
                        const timerEl = document.getElementById('WAIT-TIMER');
                        if (timerEl) timerEl.textContent = m + ':' + s;
                    }
                } else if (state.state === 'GUESSING') {
                    const elapsed = Date.now() - state.guessTimerStart;
                    const remaining = Math.max(0, state.guessTimerDuration - elapsed);
                    const totalSeconds = Math.floor(remaining / 1000);

                    if (totalSeconds <= 10 && totalSeconds > 5 && !hasWarned) {
                        warningMsg.style.display = 'block';
                        playSound('warning');
                        hasWarned = true;
                    } else if (totalSeconds <= 5) {
                        warningMsg.style.color = '#FF0000';
                        warningMsg.style.animation = 'BLINK 0.4s infinite';
                    }

                    if (remaining <= 0) {
                        timeUpMsg.style.display = 'block';
                        playSound('wrong');
                        setTimeout(() => {
                            showResult(false);
                        }, 2000);
                    }
                }
            }, 500);

            // BẮT ĐẦU LƯỢT MỚI NGAY KHI VÀO TRANG CHƠI
            botSetColorAndWait();
        }
    </script>
</body>
</html>
